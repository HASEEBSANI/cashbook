<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hotland Club Cashbook</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<style>
:root{
  --primary-gradient:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);
  --accent-color:#38bdf8;
  --glass:rgba(255,255,255,0.95);
}

body{
  background:#f1f5f9;
  font-family:Segoe UI,Roboto,Arial;
}

.offcanvas{
  background:var(--primary-gradient)!important;
  color:#fff;
  width:280px!important;
}

.nav-link{
  color:#94a3b8;
  padding:12px 20px;
  margin:4px 15px;
  border-radius:12px;
  text-decoration:none;
  display:block;
}

.nav-link:hover{
  background:rgba(255,255,255,.1);
  color:#fff;
}

.app-header{
  background:var(--glass);
  padding:12px 20px;
  position:sticky;
  top:0;
  z-index:999;
}

.container-main{
  max-width:480px;
  margin:20px auto;
  padding:0 15px;
}

.balance-card,
.history-card,
#cashbookForm{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 6px rgba(0,0,0,.05);
}

#cashbookForm{
  display:none;
}

.clickable-row{
  cursor:pointer;
}

.clickable-row:hover{
  background:#f8fafc;
}

#membersListUI{
  display:none;
}
</style>
</head>

<body>

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">

<div class="offcanvas-header">
<h5 class="fw-bold">HOTLAND CLUB</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="offcanvas">
</button>
</div>

<div class="offcanvas-body">

<a class="nav-link" href="#" onclick="hideForm()">
<i class="bi bi-house"></i>
Dashboard
</a>

<a class="nav-link" href="#" onclick="showMembersList()">
<i class="bi bi-people"></i>
Members
</a>

</div>
</div>

<div class="app-header d-flex justify-content-between align-items-center">

<button
class="btn border-0"
data-bs-toggle="offcanvas"
data-bs-target="#sidebarMenu">

<i class="bi bi-list fs-3"></i>

</button>

<h6 class="m-0 fw-bold">Dashboard</h6>

<button
class="btn btn-primary rounded-circle"
style="width:40px;height:40px"
data-bs-toggle="modal"
data-bs-target="#memberModal">

<i class="bi bi-person-plus"></i>

</button>

</div>

<div class="container-main">

<div class="balance-card text-center mb-4">

<div class="small text-muted">
TOTAL BALANCE
</div>

<div
id="balanceDisplay"
class="fw-bold text-success"
style="font-size:2.5rem">

₹0.00

</div>

</div>

<div id="mainUI">

<div class="row g-3 mb-4">

<div class="col-6">

<button
class="btn btn-success w-100 py-3 fw-bold"
onclick="showForm('In')">

CASH IN

</button>

</div>

<div class="col-6">

<button
class="btn btn-danger w-100 py-3 fw-bold"
onclick="showForm('Out')">

CASH OUT

</button>

</div>

</div>

<div class="history-card">

<div class="d-flex justify-content-between align-items-center mb-3">

<h6 class="fw-bold m-0">
Recent Activity
</h6>

<div class="small text-muted" id="pageInfo">
Page 1
</div>

</div>

<div class="table-responsive">

<table class="table table-borderless">

<tbody id="historyBody"></tbody>

</table>

</div>

<div class="d-flex justify-content-between mt-3">

<button
class="btn btn-light border"
id="prevBtn"
onclick="changePage(-1)">

Prev

</button>

<button
class="btn btn-light border"
id="nextBtn"
onclick="changePage(1)">

Next

</button>

</div>

</div>

</div>

<form id="cashbookForm">

<div class="d-flex align-items-center mb-4">

<button
type="button"
class="btn btn-light rounded-circle me-3"
onclick="hideForm()">

<i class="bi bi-arrow-left"></i>

</button>

<h5 id="formTitle" class="m-0 fw-bold">
New Entry
</h5>

</div>

<input type="hidden" id="formType">
<input type="hidden" id="rowIdField">

<div class="mb-3">

<label class="fw-bold small">
Date
</label>

<input
type="date"
id="dateField"
class="form-control"
required>

</div>

<div id="memberFieldGroup" class="mb-3">

<label class="fw-bold small">
Member
</label>

<select
id="nameInput"
class="form-select">

</select>

</div>

<div class="mb-3">

<label class="fw-bold small">
Category
</label>

<input
type="text"
id="monthField"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="fw-bold small">
Amount
</label>

<input
type="number"
id="amountField"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="fw-bold small">
Description
</label>

<textarea
id="descField"
class="form-control">

</textarea>

</div>

<button
type="submit"
id="submitBtn"
class="btn btn-primary w-100 py-3 fw-bold">

Save Entry

</button>

<button
type="button"
id="deleteBtn"
class="btn btn-link text-danger w-100 mt-2"
onclick="deleteTransaction()"
style="display:none">

Delete Transaction

</button>

</form>

<div id="membersListUI">

<div class="d-flex align-items-center mb-4">

<button
type="button"
class="btn btn-light rounded-circle me-3"
onclick="hideForm()">

<i class="bi bi-arrow-left"></i>

</button>

<h5 class="m-0 fw-bold">
Members
</h5>

</div>

<div class="history-card">

<table class="table">

<tbody id="membersTableBody"></tbody>

</table>

</div>

</div>

</div>

<div class="modal fade" id="memberModal">

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content border-0 rounded-4">

<div class="modal-header border-0">

<h5 class="fw-bold">
New Member
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<form id="memberForm">

<div class="modal-body">

<input
type="date"
id="memberDate"
class="form-control mb-3"
required>

<input
type="text"
id="memberName"
class="form-control"
placeholder="Member Name"
required>

</div>

<div class="modal-footer border-0">

<button
type="submit"
id="saveMemberBtn"
class="btn btn-primary w-100">

Save Member

</button>

</div>

</form>

</div>

</div>

</div>

<div class="modal fade" id="deleteConfirmModal">

<div class="modal-dialog modal-dialog-centered modal-sm">

<div class="modal-content border-0 text-center p-4 rounded-4">

<h5 class="fw-bold mb-3">
Delete Transaction?
</h5>

<button
class="btn btn-danger mb-2"
onclick="executeDelete()">

Yes Delete

</button>

<button
class="btn btn-light"
data-bs-dismiss="modal">

Cancel

</button>

</div>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzczSRIUyveX_QG7Fg61WY3Wuw-pLPsZpPjs0A_jvlqNnDf5J39BAlssbhyh0fgK0maZA/exec";

let currentSymbol = "₹";
let allTransactions = [];

let currentPage = 1;
const rowsPerPage = 10;

const form = document.getElementById('cashbookForm');
const mainUI = document.getElementById('mainUI');
const membersListUI = document.getElementById('membersListUI');

function hideForm(){

form.style.display='none';
membersListUI.style.display='none';
mainUI.style.display='block';

form.reset();

document.getElementById('dateField').valueAsDate =
new Date();

}

function showForm(mode,isEdit=false){

mainUI.style.display='none';
membersListUI.style.display='none';
form.style.display='block';

document.getElementById('formType').value=mode;

document.getElementById('formTitle').innerText =
isEdit ? 'Edit Entry' :
(mode==='In' ? 'Cash In' : 'Cash Out');

document.getElementById('deleteBtn').style.display =
isEdit ? 'block' : 'none';

document.getElementById('memberFieldGroup').style.display =
mode==='In' ? 'block' : 'none';

}

function showMembersList(){

mainUI.style.display='none';
form.style.display='none';

membersListUI.style.display='block';

loadMembersData();

}

async function refreshNames(){

const res =
await fetch(API_URL + "?action=members");

const names = await res.json();

const select =
document.getElementById('nameInput');

select.innerHTML =
'<option disabled selected>Select Member</option>';

names.forEach(n=>{
select.add(new Option(n,n));
});

}

async function refreshBalance(){

const res =
await fetch(API_URL + "?action=balance");

const bal =
await res.json();

document.getElementById('balanceDisplay').innerText =
currentSymbol + bal;

}

async function updateHistory(){

const res =
await fetch(API_URL + "?action=history");

allTransactions =
await res.json();

currentPage = 1;

renderTable();

}

function renderTable(){

const tbody =
document.getElementById('historyBody');

if(allTransactions.length===0){

tbody.innerHTML =
'<tr><td>No Data</td></tr>';

return;

}

const start =
(currentPage - 1) * rowsPerPage;

const end =
start + rowsPerPage;

const pageData =
allTransactions.slice(start,end);

tbody.innerHTML =
pageData.map((row,index)=>{

const realIndex = start + index;

const isIn = row[4] !== "";

return `
<tr
class="clickable-row"
onclick="editTransaction(${realIndex})">

<td>

<div class="fw-bold">
${isIn ? row[1] : row[2]}
</div>

<div class="small text-muted">
${row[0]}
</div>

</td>

<td class="${
isIn ? 'text-success' : 'text-danger'
} fw-bold text-end">

${isIn ? '+' : '-'}
${currentSymbol}
${isIn ? row[4] : row[5]}

</td>

</tr>
`;

}).join('');

const totalPages =
Math.ceil(allTransactions.length / rowsPerPage);

document.getElementById('pageInfo').innerText =
`Page ${currentPage} / ${totalPages}`;

document.getElementById('prevBtn').disabled =
currentPage === 1;

document.getElementById('nextBtn').disabled =
currentPage === totalPages;

}

function changePage(step){

const totalPages =
Math.ceil(allTransactions.length / rowsPerPage);

currentPage += step;

if(currentPage < 1){
currentPage = 1;
}

if(currentPage > totalPages){
currentPage = totalPages;
}

renderTable();

}

form.onsubmit = async function(e){

e.preventDefault();

const submitBtn =
document.getElementById('submitBtn');

submitBtn.disabled = true;

submitBtn.innerHTML =
'<span class="spinner-border spinner-border-sm me-2"></span>Processing...';

const formData = {

rowId:
document.getElementById('rowIdField').value,

date:
document.getElementById('dateField').value,

name:
document.getElementById('nameInput').value || "N/A",

month:
document.getElementById('monthField').value,

type:
document.getElementById('formType').value,

amount:
document.getElementById('amountField').value,

description:
document.getElementById('descField').value

};

try{

await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({
action:"saveTransaction",
...formData
})

});

hideForm();

await refreshBalance();

await updateHistory();

}catch(err){

alert(err);

}

submitBtn.disabled=false;

submitBtn.innerHTML='Save Entry';

};

function editTransaction(index){

const data = allTransactions[index];

showForm(
data[4] !== "" ? 'In' : 'Out',
true
);

document.getElementById('rowIdField').value =
data[6];

const d = data[0].split('-');

document.getElementById('dateField').value =
`${d[2]}-${d[1]}-${d[0]}`;

document.getElementById('nameInput').value =
data[1];

document.getElementById('monthField').value =
data[2];

document.getElementById('amountField').value =
data[4] !== "" ? data[4] : data[5];

document.getElementById('descField').value =
data[3];

}

function deleteTransaction(){

new bootstrap.Modal(
document.getElementById('deleteConfirmModal')
).show();

}

async function executeDelete(){

const rowId =
document.getElementById('rowIdField').value;

bootstrap.Modal
.getInstance(document.getElementById('deleteConfirmModal'))
.hide();

await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({
action:"deleteTransaction",
rowId:rowId
})

});

hideForm();

await refreshBalance();

await updateHistory();

}

async function loadMembersData(){

const res =
await fetch(API_URL + "?action=membersFull");

const members =
await res.json();

document.getElementById('membersTableBody').innerHTML =
members.map(m=>`

<tr>
<td>${m[0]}</td>
<td>${m[1]}</td>
</tr>

`).join('');

}

document.getElementById('memberForm').onsubmit =
async function(e){

e.preventDefault();

const btn =
document.getElementById('saveMemberBtn');

btn.disabled=true;

btn.innerHTML='Saving...';

await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"saveMember",

date:
document.getElementById('memberDate').value,

name:
document.getElementById('memberName').value

})

});

bootstrap.Modal
.getInstance(document.getElementById('memberModal'))
.hide();

this.reset();

document.getElementById('memberDate').valueAsDate =
new Date();

await refreshNames();

btn.disabled=false;

btn.innerHTML='Save Member';

};

window.onload = async function(){

document.getElementById('dateField').valueAsDate =
new Date();

document.getElementById('memberDate').valueAsDate =
new Date();

await refreshNames();

await refreshBalance();

await updateHistory();

};

</script>

</body>
</html>
